name: Deploy Flower website and CMS
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      VITE_PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      FLOWER_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      FLOWER_SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build administrator app
        run: |
          npm install --prefix admin-app --no-audit --no-fund
          npm run build --prefix admin-app
      - name: Assemble static website and runtime configuration
        run: node scripts/assemble-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
